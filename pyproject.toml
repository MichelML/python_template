[project]
name = "app"
version = "0.1.0"
description = "A small, clean Python project."
requires-python = ">=3.12"
dependencies = []

[project.scripts]
app = "app.cli:main"

[dependency-groups]
api = [
    "fastapi>=0.162.0",
    "httpx2>=2.16.0",
    "uvicorn>=0.54.0",
]
dev = [
    "mypy>=1.13",
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "SIM",  # flake8-simplify
    "C4",   # flake8-comprehensions
    "RUF",  # ruff-specific rules
    "PT",   # flake8-pytest-style
    "BLE",  # no blind except
    "ANN",  # type annotations
    "PL",   # pylint
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR2004"]  # magic values are fine in assertions

[tool.mypy]
strict = true
python_version = "3.12"
mypy_path = "src"
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
